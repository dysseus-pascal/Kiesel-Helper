# Baut die App und haengt das APK an den Lauf.
#
# WARUM HIER UND NICHT LOKAL: auf dem Entwicklungsrechner steht kein
# Android-SDK - dort laesst sich die App weder uebersetzen noch ausprobieren.
# Dieser Lauf ist damit die einzige Pruefung, die es fuer sie gibt: er belegt,
# dass sie uebersetzt und ein Paket ergibt. Dass sie am Telefon das Richtige
# TUT, belegt er nicht.
name: Bauen

on:
  push:
  pull_request:
  workflow_dispatch:

# Schreibrecht nur fuer das Release: eine neue Fassung auf main legt es an
# und haengt die APK dazu.
permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 bereitstellen
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle bereitstellen
        uses: gradle/actions/setup-gradle@v4
        with:
          # Festgenagelt, nicht dem Neuesten ueberlassen: Gradle 9.6 hat eine
          # interne Schnittstelle entfernt, auf die das Android-Plugin 8.x noch
          # baut ("relies on InternalProblems, removed in Gradle 9.6.0"). Der
          # Fehler nennt 9.5 selbst als die Fassung, die geht.
          gradle-version: '9.5.1'

      - name: Zettelleser pruefen
        run: gradle --no-daemon test

      - name: Uebersetzen
        run: gradle --no-daemon assembleDebug

      - name: APK anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: kiesel-helper-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # EINE NEUE FASSUNG AUF MAIN IST EIN RELEASE. Steht in build.gradle.kts
      # eine versionName, zu der es noch kein Release gibt, legt der Lauf es
      # an - samt Tag und APK. Ein Tag von Hand braucht es nicht.
      #
      # Der Text kommt aus .github/release/<fassung>.md (erste Zeile Titel,
      # der Rest Text), sonst aus dem Commit. Ein bestehendes Release wird
      # nicht angeruehrt: was einmal heruntergeladen wurde, bleibt so.
      - name: Release anlegen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FASSUNG="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          TAG="v$FASSUNG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon."
            exit 0
          fi
          cp app/build/outputs/apk/debug/*.apk kiesel-helper.apk
          NOTIZ=".github/release/$FASSUNG.md"
          if [ -f "$NOTIZ" ]; then
            TITEL="$FASSUNG - $(head -1 "$NOTIZ")"
            tail -n +2 "$NOTIZ" > notizen.md
          else
            TITEL="$FASSUNG - $(git log -1 --format=%s)"
            git log -1 --format=%b | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > notizen.md
          fi
          gh release create "$TAG" kiesel-helper.apk \
            --target "$GITHUB_SHA" --title "$TITEL" --notes-file notizen.md
