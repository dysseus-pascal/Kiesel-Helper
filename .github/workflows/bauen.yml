# Baut die App und haengt das APK an den Lauf.
#
# WARUM HIER UND NICHT LOKAL: auf dem Entwicklungsrechner steht kein
# Android-SDK - dort laesst sich die App weder uebersetzen noch ausprobieren.
# Dieser Lauf ist damit die einzige Pruefung, die es fuer sie gibt: er belegt,
# dass sie uebersetzt und ein Paket ergibt. Dass sie am Telefon das Richtige
# TUT, belegt er nicht.
name: Bauen

on:
  push:
  pull_request:
  workflow_dispatch:

# Schreibrecht nur fuer das Release: ein Tag v* legt es an und haengt die
# APK dazu.
permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 bereitstellen
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle bereitstellen
        uses: gradle/actions/setup-gradle@v4
        with:
          # Festgenagelt, nicht dem Neuesten ueberlassen: Gradle 9.6 hat eine
          # interne Schnittstelle entfernt, auf die das Android-Plugin 8.x noch
          # baut ("relies on InternalProblems, removed in Gradle 9.6.0"). Der
          # Fehler nennt 9.5 selbst als die Fassung, die geht.
          gradle-version: '9.5.1'

      # Der Schluessel liegt als Base64 in einem Secret. Ohne ihn (ein PR aus
      # einem fremden Repo sieht keine Secrets) signiert Gradle mit dem
      # Debug-Schluessel des Laufs - fuer eine Pruefung reicht das.
      - name: Signierschluessel bereitlegen
        env:
          KEYSTORE_BASE64: ${{ secrets.KIESEL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiesel.jks"
            echo "KIESEL_KEYSTORE=$RUNNER_TEMP/kiesel.jks" >> "$GITHUB_ENV"
          else
            echo "Kein Schluessel hinterlegt - Debug-Signatur."
          fi

      - name: Zettelleser pruefen
        run: gradle --no-daemon test

      - name: Uebersetzen
        env:
          KIESEL_KEYSTORE_PASSWORT: ${{ secrets.KIESEL_KEYSTORE_PASSWORT }}
          KIESEL_KEY_ALIAS: ${{ secrets.KIESEL_KEY_ALIAS }}
          KIESEL_KEY_PASSWORT: ${{ secrets.KIESEL_KEY_PASSWORT }}
        run: gradle --no-daemon assembleDebug

      - name: APK anhaengen
        uses: actions/upload-artifact@v4
        with:
          name: kiesel-helper-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # EIN TAG IST EIN RELEASE. Gibt es das Release schon - von Hand
      # angelegt, mit eigenem Text -, wird nur die APK ersetzt und der Text
      # nicht angeruehrt. Sonst entsteht es aus dem Commit: die erste Zeile
      # wird der Titel, der Rest der Text.
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tag und Fassung im Code muessen uebereinstimmen - sonst hiesse
          # das Release anders als das, was darin steckt.
          IM_CODE="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          [ "$IM_CODE" = "${TAG#v}" ] || { echo "Tag $TAG, im Code $IM_CODE"; exit 1; }
          # Nie ein Release mit dem Wegwerf-Schluessel: diese APK liesse sich
          # nicht ueber die vorige installieren.
          [ -n "$KIESEL_KEYSTORE" ] || { echo "Kein Signierschluessel - kein Release."; exit 1; }
          cp app/build/outputs/apk/debug/*.apk kiesel-helper.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" kiesel-helper.apk --clobber
          else
            git log -1 --format=%b HEAD | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > notizen.md
            gh release create "$TAG" kiesel-helper.apk \
              --title "${TAG#v} - $(git log -1 --format=%s HEAD)" \
              --notes-file notizen.md
          fi
